<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>Hoymiles HAS</title>
  <style>
    :root { color-scheme: dark; font-family: ui-sans-serif, system-ui, sans-serif; }
    body { margin: 0; background: #0b1220; color: #e6edf7; }
    main { max-width: 960px; margin: 0 auto; padding: 1.25rem; }
    h1 { font-size: 1.25rem; margin: 0 0 .25rem; }
    .sub { color: #8b9bb4; margin-bottom: 1rem; }
    .grid { display: grid; gap: .75rem; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); }
    .card { background: #121a2b; border: 1px solid #243047; border-radius: 12px; padding: .9rem; }
    .label { color: #8b9bb4; font-size: .75rem; text-transform: uppercase; letter-spacing: .04em; }
    .value { font-size: 1.55rem; font-weight: 650; margin-top: .25rem; font-variant-numeric: tabular-nums; }
    .unit { font-size: .85rem; color: #8b9bb4; margin-left: .25rem; }
    .ok { color: #3ddc97; } .bad { color: #ff6b6b; } .warn { color: #ffd166; }
    table { width: 100%; border-collapse: collapse; margin-top: 1rem; }
    td, th { text-align: left; padding: .45rem .4rem; border-bottom: 1px solid #243047; }
    th { color: #8b9bb4; font-weight: 500; font-size: .8rem; }
    .bar { height: 6px; background: #243047; border-radius: 99px; overflow: hidden; margin-top: .5rem; }
    .bar > i { display: block; height: 100%; background: linear-gradient(90deg,#3ddc97,#5b8def); width: 0; transition: width .4s; }
    footer { margin-top: 1.25rem; color: #6b7c95; font-size: .8rem; }
    a { color: #7cb7ff; }
  </style>
</head>
<body>
<main>
  <h1>Hoymiles HAS-3.0LV-EUG1</h1>
  <div class="sub">Local gateway · TCP/10081 · live via SSE</div>

  <div class="grid">
    <div class="card">
      <div class="label">Battery SOC</div>
      <div class="value" id="soc">–</div>
      <div class="bar"><i id="soc_bar"></i></div>
    </div>
    <div class="card">
      <div class="label">House load (CT2)</div>
      <div class="value" id="load">–</div>
    </div>
    <div class="card">
      <div class="label">Grid (CT1)</div>
      <div class="value" id="grid">–</div>
      <div class="label" id="grid_dir"></div>
    </div>
    <div class="card">
      <div class="label">HAS inverter</div>
      <div class="value" id="inv">–</div>
    </div>
    <div class="card">
      <div class="label">Battery</div>
      <div class="value" id="bat">–</div>
    </div>
    <div class="card">
      <div class="label">Grid → Load</div>
      <div class="value" id="g2l">–</div>
    </div>
  </div>

  <table>
    <thead><tr><th>Field</th><th>Value</th></tr></thead>
    <tbody id="detail"></tbody>
  </table>

  <footer>
    <a href="/api/v1/state">/api/v1/state</a> ·
    <a href="/api/v1/registry">/api/v1/registry</a> ·
    <a href="/api/v1/stream">/api/v1/stream</a> ·
    <span id="status">connecting…</span>
  </footer>
</main>
<script>
const $ = (id) => document.getElementById(id);
function fmtW(v) {
  if (v == null) return '–';
  return `${Math.round(v)}<span class="unit">W</span>`;
}
function phase0(obj) {
  return (obj && obj.phases && obj.phases[0]) || {};
}
function render(s) {
  const bat = s.battery || {};
  const grid = phase0(s.grid);
  const load = phase0(s.load);
  const inv = phase0(s.inverter);
  const flow = s.power_flow || {};

  $('soc').innerHTML = `${bat.state_of_charge ?? '–'}<span class="unit">%</span>`;
  $('soc_bar').style.width = `${bat.state_of_charge || 0}%`;

  $('load').innerHTML = fmtW(load.active_power);
  const gp = grid.active_power;
  $('grid').innerHTML = fmtW(Math.abs(gp));
  $('grid').className = 'value ' + (gp < 0 ? 'bad' : 'ok');
  $('grid_dir').textContent = gp < 0 ? 'importing' : (gp > 0 ? 'exporting' : 'idle');

  $('inv').innerHTML = fmtW(inv.active_power);
  $('bat').innerHTML = fmtW(bat.power);
  $('g2l').innerHTML = fmtW(flow.grid_to_load);

  const rows = [
    ['Battery voltage', bat.voltage + ' V'],
    ['Battery SOH', bat.state_of_health + ' %'],
    ['Grid voltage', grid.voltage + ' V'],
    ['Grid frequency', grid.frequency + ' Hz'],
    ['Load voltage', load.voltage + ' V'],
    ['PV → Load', flow.pv_to_load + ' W'],
    ['PV → Battery', flow.pv_to_battery + ' W'],
    ['Battery → Load', flow.battery_to_load + ' W'],
    ['Updated', new Date((s.timestamp || 0) * 1000).toLocaleTimeString()],
  ];
  $('detail').innerHTML = rows.map(([k,v]) => `<tr><th>${k}</th><td>${v}</td></tr>`).join('');
  $('status').textContent = 'live';
  $('status').className = 'ok';
}

const es = new EventSource('/api/v1/stream');
es.onmessage = (ev) => {
  try { render(JSON.parse(ev.data)); } catch (e) { console.error(e); }
};
es.onerror = () => {
  $('status').textContent = 'reconnecting…';
  $('status').className = 'warn';
};
</script>
</body>
</html>
